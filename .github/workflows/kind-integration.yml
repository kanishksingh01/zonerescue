name: Kind Zone Workload Integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: zonerescue-kind-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-zone-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: helm/kind-action@v1.13.0
        with:
          cluster_name: zonerescue
          config: deploy/kind-config.yaml
          wait: 120s
      - name: Label worker zones
        run: |
          kubectl --context kind-zonerescue label node zonerescue-worker topology.kubernetes.io/zone=zone-a
          kubectl --context kind-zonerescue label node zonerescue-worker2 topology.kubernetes.io/zone=zone-b
          kubectl --context kind-zonerescue label node zonerescue-worker3 topology.kubernetes.io/zone=zone-c
      - name: Deploy zonal demo workloads
        run: |
          kubectl --context kind-zonerescue apply -f deploy/zonal-demo.yaml
          kubectl --context kind-zonerescue apply -f deploy/spread-demo.yaml
          for zone in a b c; do
            kubectl --context kind-zonerescue -n zonerescue-lab rollout status deployment/demo-$zone --timeout=180s
          done
      - name: Verify actual in-cluster Service routing and isolation
        run: |
          kubectl --context kind-zonerescue apply -f deploy/probe.yaml
          kubectl --context kind-zonerescue -n zonerescue-lab wait --for=condition=Ready pod/zone-probe --timeout=180s
          python -m zonerescue.cluster_probe
          python -m zonerescue.spread_probe
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zonerescue-kind-zone-report
          path: |
            kind-routing-report.json
            spread-placement-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Diagnostics on error
        if: failure()
        run: |
          kubectl --context kind-zonerescue -n zonerescue-lab get deploy,pods,svc,endpointslices -o wide || true
          kubectl --context kind-zonerescue -n zonerescue-lab describe pods || true
