# In-cluster HTTP client pinned to zone-a; all requests traverse real ClusterIP routing.
apiVersion: v1
kind: Pod
metadata:
  name: zone-probe
  namespace: zonerescue-lab
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    topology.kubernetes.io/zone: zone-a
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
